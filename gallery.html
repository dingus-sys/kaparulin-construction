  <span class="next" onclick="navLightbox(1)">&#10095;</span>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const photos = ["images/photo01.jpg", "images/photo02.jpg", "images/photo03.jpg", "images/photo04.jpg", "images/photo05.jpg", "images/photo06.jpg", "images/photo07.jpg", "images/photo08.jpg", "images/photo09.jpg", "images/photo10.jpg", "images/photo11.jpg", "images/photo12.jpg", "images/photo13.jpg", "images/photo14.jpg", "images/photo15.jpg", "images/photo16.jpg", "images/photo17.jpg", "images/photo18.jpg", "images/photo19.jpg", "images/photo21.jpg", "images/photo22.jpg", "images/photo24.jpg", "images/photo25.jpg", "images/photo26.jpg", "images/photo27.jpg", "images/photo28.jpg", "images/photo29.jpg", "images/photo30.jpg", "images/photo31.jpg", "images/photo32.jpg", "images/photo33.jpg", "images/photo34.jpg", "images/photo35.jpg", "images/photo36.jpg", "images/photo37.jpg", "images/photo38.jpg", "images/photo39.jpg", "images/photo40.jpg", "images/photo41.jpg", "images/photo42.jpg", "images/photo43.jpg", "images/photo44.jpg", "images/photo45.jpg", "images/photo46.jpg", "images/photo47.jpg"];
let current = 0;

function openLightbox(i) {
  current = i;
  document.getElementById('lightbox-img').src = photos[i];
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

function navLightbox(dir) {
  current = (current + dir + photos.length) % photos.length;
  document.getElementById('lightbox-img').src = photos[current];
}

document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});
</script>
